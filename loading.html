<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Paperfect - Initializing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0f0f1b 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 480px;
            padding: 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Premium Loader */
        .loader-ring {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
        }

        .loader-ring div {
            box-sizing: border-box;
            display: block;
            position: absolute;
            width: 64px;
            height: 64px;
            margin: 8px;
            border: 3px solid transparent;
            border-radius: 50%;
            animation: ringRotate 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            border-top-color: #6c5ce7;
        }

        .loader-ring div:nth-child(1) {
            animation-delay: -0.45s;
            border-top-color: #a29bfe;
        }

        .loader-ring div:nth-child(2) {
            animation-delay: -0.3s;
            border-top-color: #00cec9;
        }

        .loader-ring div:nth-child(3) {
            animation-delay: -0.15s;
            border-top-color: #ffeaa7;
        }

        @keyframes ringRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .desc-cn {
            font-size: 14px;
            color: #b2bec3;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .desc-en {
            font-size: 12px;
            color: #74b9ff;
            opacity: 0.8;
            line-height: 1.5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            margin-top: 25px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 30%;
            background: linear-gradient(90deg, #00cec9, #6c5ce7);
            border-radius: 2px;
            animation: indeterminate 2s infinite linear;
        }

        @keyframes indeterminate {
            0% { transform: translateX(-100%) scaleX(0.5); }
            50% { transform: translateX(0%) scaleX(1); }
            100% { transform: translateX(100%) scaleX(0.5); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader-ring">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <h2>初始化中 / Initializing</h2>
        <p class="desc-cn">正在配置 Python 运行环境，首次启动可能需要 1-2 分钟，请稍候...</p>
        <p class="desc-en">Configuring Python runtime environment.<br>First launch may take 1-2 minutes, please wait...</p>
        <div class="progress-bar-container">
            <div class="progress-bar-fill"></div>
        </div>
    </div>
</body>
</html>
