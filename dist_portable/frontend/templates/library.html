<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Paperfect - 文献管理</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    
    <!-- Load Vue 3 and Vue Router via CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
    <script src="https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"></script>
    
    <style>
        :root {
            --bg-color: #282C34;
            --text-color: #ABB2BF;
            --header-bg: #194A50;
            --header-border: #21252B;
            --card-bg: #21252B;
            --card-border: #21252B;
            --card-hover-border: #3D71D9;
            --primary-accent: #3D71D9; 
            --primary-hover: #3D71D9;
            --secondary-accent: #3D71D9; 
            --text-muted: #ABB2BF;
            --input-bg: #21252B;
            --icon-btn-bg: #21252B;
            --logo-color: #ABB2BF;
        }

        body[data-theme="antigravity"] {
            --bg-color: #16161D; --text-color: #878AA2; --header-bg: #1A1B25; --header-border: #1A1B25;
            --card-bg: #1A1B25; --card-border: #1A1B25; --card-hover-border: #6E88BD;
            --primary-accent: #6E88BD; --primary-hover: #88D6CC; --secondary-accent: #88D6CC;
            --text-muted: #878AA2; --input-bg: #1A1B25; --icon-btn-bg: #1A1B25;
            --logo-color: #878AA2;
        }

        body[data-theme="dark-plus"] {
            --bg-color: #1E1E1E; --text-color: #CCCCCC; --header-bg: #1B4D54; --header-border: #181818;
            --card-bg: #181818; --card-border: #181818; --card-hover-border: #004F8B;
            --primary-accent: #004F8B; --primary-hover: #004F8B; --secondary-accent: #004F8B;
            --text-muted: #CCCCCC; --input-bg: #181818; --icon-btn-bg: #181818;
            --logo-color: #CCCCCC;
        }

        body[data-theme="cyan-light"] {
            --bg-color: #FFFFFF; --text-color: #202224; --header-bg: #8EE8E6; --header-border: #F4F7F9;
            --card-bg: #F4F7F9; --card-border: #F4F7F9; --card-hover-border: #39B2B2;
            --primary-accent: #39B2B2; --primary-hover: #39B2B2; --secondary-accent: #39B2B2;
            --text-muted: #202224; --input-bg: #F4F7F9; --icon-btn-bg: #F4F7F9;
            --logo-color: #202224;
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif; 
            margin: 0; padding: 0; 
            height: 100vh;
            background: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
            transition: background 0.3s, color 0.3s;
            overflow: hidden;
        }
        
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        
        /* Top Navigation Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            padding: 0 20px;
            border-bottom: 2px solid var(--header-border);
            background: var(--bg-color);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 250px;
        }

        .logo-box {
            width: 40px; height: 40px;
            border: 1px solid var(--text-color);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold;
        }

        .module-title-btn {
            background: var(--header-bg);
            border: 1px solid var(--header-border);
            color: var(--text-color);
            padding: 6px 15px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            appearance: none; /* Hide default arrow */
        }

        .top-bar-center {
            display: flex;
            gap: 10px;
            flex: 1;
            justify-content: center;
        }

        .main-tab {
            background: transparent;
            border: 1px solid var(--header-border);
            color: var(--text-color);
            padding: 8px 40px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .main-tab.active {
            background: var(--primary-accent);
            color: #fff;
            border-color: var(--primary-accent);
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 350px;
            justify-content: flex-end;
        }

        .search-bar-top {
            background: var(--input-bg);
            border: 1px solid var(--header-border);
            color: var(--text-color);
            padding: 6px 10px;
            width: 150px;
            outline: none;
        }

        .icon-box {
            width: 24px; height: 24px;
            border: 1px solid var(--header-border);
            display: inline-block;
        }

        /* Layout Container */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Sub Navigation Bar for Auto-Classification */
        .sub-nav-bar {
            display: flex;
            gap: 15px;
            padding: 15px 20px;
            border-bottom: 1px solid var(--header-border);
        }

        .sub-tab {
            background: transparent;
            border: 1px solid var(--header-border);
            color: var(--text-color);
            padding: 6px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .sub-tab.active {
            background: var(--primary-accent);
            color: #fff;
            border-color: var(--primary-accent);
        }

        /* Content Area */
        .content-area {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .main-view {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .right-sidebar {
            width: 300px;
            border-left: 2px solid var(--header-border);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Elements from mockups */
        .dashed-box {
            border: 2px dashed var(--text-color);
            border-radius: 20px;
            height: 150px;
            margin-bottom: 30px;
            display: flex; align-items: center; justify-content: center;
        }

        .recent-card {
            width: 120px; height: 160px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            display: inline-block;
            margin-right: 20px;
        }

        .folder-row {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid var(--header-border);
        }

        .folder-mock {
            width: 200px; height: 140px;
            background: var(--primary-accent);
            position: relative;
            cursor: pointer;
            border-radius: 4px 10px 10px 10px;
        }
        .folder-mock::before {
            content: ''; position: absolute; top: -15px; left: 0;
            width: 80px; height: 15px; background: var(--primary-accent);
            border-right: 1px solid var(--bg-color);
            border-radius: 8px 8px 0 0;
        }

        /* Document List Styling (Replacing Mock Silver/Blue rectangles) */
        .doc-list-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: 0.2s;
            cursor: pointer;
        }
        .doc-list-item:hover {
            border-color: var(--card-hover-border);
        }
        .doc-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 4px;
        }
        .doc-abstract {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }
        .doc-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag-badge {
            background: var(--primary-accent);
            color: #fff;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .recent-card {
            width: 210px; height: 300px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            display: inline-block;
            margin-right: 20px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }
        .recent-card:hover { border-color: var(--primary-accent); transform: translateY(-5px); }
        .recent-card img { width: 100%; height: 100%; object-fit: cover; object-position: top; }

        /* Settings Modal reused for Upload Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1000;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--header-bg); border: 1px solid var(--header-border);
            border-radius: 12px; padding: 30px; width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .modal-header h2 { margin: 0; font-size: 18px; color: var(--text-color); }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
        .form-group select, .form-group input {
            width: 100%; box-sizing: border-box; background: var(--input-bg);
            border: 1px solid var(--header-border); color: var(--text-color);
            padding: 10px 12px; border-radius: 8px; outline: none;
        }
        .save-btn {
            width: 100%; background: var(--primary-accent); border: none;
            padding: 12px; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer;
        }
        
        .delete-btn {
            position: absolute; top: 10px; right: 10px;
            background: rgba(255, 0, 0, 0.7); color: white;
            border: none; border-radius: 4px; width: 30px; height: 30px;
            font-size: 16px; cursor: pointer; display: none; z-index: 10;
        }
        .recent-card:hover .delete-btn { display: block; }
        .doc-list-item { position: relative; }
        .doc-list-item:hover .delete-btn { display: block; }


        /* Right Sidebar Checkboxes & Buttons */
        .filter-section {
            border: 1px solid var(--header-border);
            padding: 10px;
        }
        .filter-title {
            background: var(--header-bg);
            padding: 4px 8px;
            font-size: 12px;
            margin: -10px -10px 10px -10px;
            border-bottom: 1px solid var(--header-border);
        }
        .checkbox-row {
            display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 14px;
        }
        .checkbox-row input {
            width: 16px; height: 16px; accent-color: var(--primary-accent);
        }
        
        /* Segmented Buttons for JCR/CCF */
        .segmented-control {
            display: flex;
            width: 100%;
        }
        .segmented-control button {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--header-border);
            color: var(--text-color);
            padding: 6px 0;
            font-size: 12px;
            cursor: pointer;
            margin-left: -1px; /* collapse borders */
        }
        .segmented-control button.active {
            background: var(--primary-accent);
            color: #fff;
        }
        .segmented-control button:first-child { margin-left: 0; }

        .theme-selector-wrapper {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body data-theme="antigravity">
    <div id="app">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <a href="/" title="Back to Home"><div class="project-logo"></div></a>
                <div style="position: relative; display: flex; align-items: center;">
                    <select class="module-title-btn" onchange="if(this.value === 'prompt'){ window.location.href='/old_index#prompt'; } else if (this.value === 'data') { window.location.href='/old_index'; }">
                        <option value="library">资料管理</option>
                        <option value="data">旧版资料管理</option>
                        <option value="prompt">提示词管理</option>
                    </select>
                    <div style="position: absolute; right: 10px; pointer-events: none; font-size:12px; color:var(--text-color);">▽</div>
                </div>
            </div>
            <div class="top-bar-center">
                <button class="main-tab" :class="{active: currentMainTab === 'dashboard'}" @click="switchMainTab('dashboard')">我的资料</button>
                <button class="main-tab" :class="{active: currentMainTab === 'auto'}" @click="switchMainTab('auto')">自动分类</button>
            </div>
            <div class="top-bar-right">
                <input type="text" class="search-bar-top">
                <div class="icon-box"></div>
                <div class="icon-box" style="width:40px;"></div>
                <div class="icon-box"></div>
                <div class="icon-box"></div>
            </div>
        </div>

        <div class="app-container">
            <!-- Router View handles the rest of the layout -->
            <router-view></router-view>
        </div>

        <!-- Theme selector just for convenience (can be hidden) -->
        <div class="theme-selector-wrapper">
            <select v-model="currentTheme" @change="changeTheme" style="background: var(--input-bg); color: var(--text-color); border: 1px solid var(--header-border); padding: 4px; outline: none; font-size: 12px;">
                <option value="antigravity">Antigravity</option>
                <option value="dark-plus">Dark+</option>
                <option value="cyan-light">Cyan Light</option>
            </select>
        </div>
        
        <!-- Upload Modal (Injected to the root) -->
        <div class="modal-overlay" id="uploadModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>上传文献</h2>
                    <button class="close-btn" onclick="document.getElementById('uploadModal').classList.remove('active')">&times;</button>
                </div>
                <p id="selectedFileName" style="color:var(--text-muted); font-size:13px; margin-top:0; word-break: break-all;"></p>
                
                <div class="form-group">
                    <label>将其作为何种类型解析？</label>
                    <select id="upload_item_type" onchange="document.getElementById('paper_options_group').style.display = this.value === 'paper' ? 'block' : 'none'">
                        <option value="book">教材/书籍 (仅解析结构)</option>
                        <option value="paper" selected>论文 (深度解析与打标)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>存入文件夹</label>
                    <div style="display:flex; gap:10px;">
                        <select id="upload_folder_select" style="flex:1;">
                            <option value="">默认文件夹</option>
                            <!-- Dynamically populated via JS -->
                        </select>
                        <input type="text" id="upload_folder_new" placeholder="或新建文件夹..." style="flex:1;">
                    </div>
                </div>

                <div id="paper_options_group" style="background: rgba(0,0,0,0.1); padding: 15px; border-radius: 8px; border: 1px dashed var(--header-border); margin-bottom: 15px;">
                    <div class="form-group">
                        <label>选择提示词方案</label>
                        <select id="upload_prompt">
                            <option value="计算机+人工智能">计算机+人工智能</option>
                            <option value="提示词汇总">默认提示词</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>PPT生成模式</label>
                        <select id="upload_ppt_mode">
                            <option value="simple">简单</option>
                            <option value="creative" selected>详细 (Creative)</option>
                        </select>
                    </div>
                </div>
                
                <button class="save-btn" id="finalUploadBtn">确认并开始上传</button>
            </div>
        </div>
    </div>

    <script type="module" src="/static/js/library/main.js?v=2.0"></script>
</body>
</html>
