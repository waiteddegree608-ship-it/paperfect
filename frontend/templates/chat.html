<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Paperfect - {{ book_name }}</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <script>
    (function () {
        try {
            var t = localStorage.getItem('theme') || 'antigravity';
            if (t === 'light') t = 'cyan-light';
            if (t === 'dark' || t === 'github-dark') t = 'antigravity';
            var lang = localStorage.getItem('paperfect_lang') || 'zh';
            document.documentElement.setAttribute('lang', lang === 'en' ? 'en' : 'zh-CN');
            document.documentElement.setAttribute('data-theme', t);
            var applyBody = function () {
                if (document.body) document.body.setAttribute('data-theme', t);
            };
            applyBody();
            document.addEventListener('DOMContentLoaded', applyBody);
        } catch (e) {}
    })();
    </script>
    <!-- Google Fonts removed to prevent 10s loading delay in China -->
    <style>
        /* GitHub Dark (Default Dark) Fallback */
        :root {
            --bg-color: #282C34; --text-color: #ABB2BF; --pane-bg: #282C34; --pane-border: #21252B;
            --pane-header-bg: #194A50; --header-text: #ABB2BF; --primary-accent: #3D71D9; --primary-hover: #3D71D9;
            --secondary-accent: #3D71D9; --secondary-hover: #3D71D9; --danger-color: #3D71D9; --upload-accent: #3D71D9;
            --btn-bg: #21252B; --btn-border: #21252B; --chat-area-bg: #282C34; --user-bubble-bg: #21252B;
            --user-bubble-text: #ABB2BF; --ai-bubble-bg: #282C34; --ai-bubble-border: #21252B; --input-bg: #21252B;
            --bot-status-color: #3D71D9; --secondary-text: #ABB2BF;
        }

        body[data-theme="antigravity"] {
            --bg-color: #16161D; --text-color: #878AA2; --pane-bg: #16161D; --pane-border: #1A1B25;
            --pane-header-bg: #1A1B25; --header-text: #88D6CC; --primary-accent: #6E88BD; --primary-hover: #88D6CC;
            --secondary-accent: #88D6CC; --secondary-hover: #88D6CC; --danger-color: #DF5953; --upload-accent: #6E88BD;
            --btn-bg: #1A1B25; --btn-border: #1A1B25; --chat-area-bg: #16161D; --user-bubble-bg: #1A1B25;
            --user-bubble-text: #88D6CC; --ai-bubble-bg: #16161D; --ai-bubble-border: #1A1B25; --input-bg: #1A1B25;
            --bot-status-color: #88D6CC; --secondary-text: #878AA2;
        }

        body[data-theme="dark-plus"] {
            --bg-color: #1E1E1E; --text-color: #CCCCCC; --pane-bg: #181818; --pane-border: #181818;
            --pane-header-bg: #1B4D54; --header-text: #CCCCCC; --primary-accent: #3794ff; --primary-hover: #5ea3ff;
            --secondary-accent: #3794ff; --secondary-hover: #5ea3ff; --danger-color: #e74c3c; --upload-accent: #3794ff;
            --btn-bg: #181818; --btn-border: #181818; --chat-area-bg: #1E1E1E; --user-bubble-bg: #181818;
            --user-bubble-text: #CCCCCC; --ai-bubble-bg: #1E1E1E; --ai-bubble-border: #181818; --input-bg: #181818;
            --bot-status-color: #3794ff; --secondary-text: #CCCCCC;
        }

        body[data-theme="cyan-light"] {
            --bg-color: #FFFFFF; --text-color: #202224; --pane-bg: #F4F7F9; --pane-border: #F4F7F9;
            --pane-header-bg: #8EE8E6; --header-text: #202224; --primary-accent: #39B2B2; --primary-hover: #39B2B2;
            --secondary-accent: #39B2B2; --secondary-hover: #39B2B2; --danger-color: #39B2B2; --upload-accent: #39B2B2;
            --btn-bg: #F4F7F9; --btn-border: #F4F7F9; --chat-area-bg: #FFFFFF; --user-bubble-bg: #F4F7F9;
            --user-bubble-text: #202224; --ai-bubble-bg: #FFFFFF; --ai-bubble-border: #F4F7F9; --input-bg: #F4F7F9;
            --bot-status-color: #39B2B2; --secondary-text: #202224;
        }

        body { 
            margin: 0; padding: 20px;
            display: flex; height: 100vh; box-sizing: border-box;
            background: var(--bg-color);
            font-family: 'Inter', -apple-system, "Microsoft YaHei", sans-serif;
            color: var(--text-color);
            gap: 20px;
            flex-direction: column; 
            transition: background 0.3s, color 0.3s;
        }
        
        /* 定制全局滚动条，消灭 Windows 原本丑陋的粗条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        /* 各种阅读器的弹性布局 */
        .panes-container {
            display: flex;
            flex: 1;
            /* gap is replaced by .resizer width */
            overflow: hidden;
        }

        .resizer {
            width: 20px;
            cursor: col-resize;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            z-index: 10;
        }
        .resizer::after {
            content: "";
            width: 4px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            transition: 0.2s;
        }
        .resizer:hover::after, .resizer:active::after {
            background: #3b82f6;
            height: 100%;
        }

        .pane {
            flex: 1;
            min-width: 250px;
            background: var(--pane-bg); 
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--pane-border);    
            display: flex;
            flex-direction: column;
        }
        .pane-header {
            background: var(--pane-header-bg);
            padding: 8px 15px;
            font-size: 13px;
            color: var(--header-text);
            border-bottom: 1px solid var(--pane-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .pane iframe {
            flex: 1;
            width: 100%; 
            border: none; 
            background: #111; 
        }
        
        /* 布局控制栏: 现在独立悬浮于顶部 */
        .layout-controls {
            display: flex;
            gap: 15px;
            background: var(--pane-bg);
            padding: 12px 20px;
            border-radius: 16px;
            border: 1px solid var(--pane-border);
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        .layout-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-color);
            padding: 6px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .layout-btn.active {
            background: var(--primary-accent);
            border-color: var(--primary-accent);
            color: #fff;
        }
        .layout-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
        .layout-btn { display: flex; align-items: center; gap: 6px; }
        .toolbar-divider { width: 1px; height: 20px; background: var(--pane-border); flex-shrink: 0; margin: 0 2px; }
        .view-switch { display: flex; background: var(--chat-area-bg); border: 1px solid var(--pane-border); border-radius: 10px; padding: 3px; gap: 2px; }
        .view-switch .view-btn {
            display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 7px;
            border: none; background: transparent; color: var(--text-color); font-size: 13px;
            cursor: pointer; transition: 0.2s;
        }
        .view-switch .view-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
        .view-switch .view-btn:hover { background: var(--btn-bg); }
        .view-switch .view-btn.active { background: var(--primary-accent); color: #fff; }
        .tools-wrap { position: relative; }
        .tool-panel {
            display: none; flex-direction: column; position: absolute; right: 0; top: 130%; width: 300px;
            background: var(--pane-bg); border: 1px solid var(--pane-border); border-radius: 14px;
            padding: 14px; z-index: 30; box-shadow: 0 10px 30px rgba(0,0,0,.25);
        }
        .tool-panel-dpi { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
        .tool-panel-dpi label { font-size: 12px; color: var(--secondary-text); }
        .tool-panel-dpi input { width: 70px; padding: 4px 6px; background: var(--input-bg); border: 1px solid var(--btn-border); color: var(--text-color); border-radius: 6px; }
        .tool-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .tool-card {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
            padding: 10px 4px; border-radius: 10px; border: 1px solid var(--pane-border);
            background: var(--btn-bg); color: var(--text-color); cursor: pointer; transition: 0.15s;
            text-align: center; font-size: 11px; min-height: 62px;
        }
        .tool-card svg { width: 18px; height: 18px; color: var(--secondary-text); transition: 0.15s; }
        .tool-card:hover { border-color: var(--primary-accent); }
        .tool-card:hover svg { color: var(--primary-accent); }
        
        /* 右侧问答智域 */
        .right-pane { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            gap: 20px;
        }
        
        /* 聊天区域主屏：毛玻璃拟物化 */
        .chat-area { 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 24px;
            padding: 24px;
            background: var(--chat-area-bg);
            border: 1px solid var(--pane-border);
            border-radius: 20px;
            scroll-behavior: smooth;
        }
        
        .bubble-container { display: flex; align-items: flex-end; gap: 12px; max-width: 90%; }
        .user-row { justify-content: flex-end; width: 100%; align-self: flex-end; }
        .ai-row { justify-content: flex-start; width: 100%; align-self: flex-start;}
        
        .bubble { 
            padding: 14px 20px; 
            border-radius: 16px; 
            font-size: 14.5px; 
            line-height: 1.65;
            word-break: break-word;
        }
        
        .bubble p { margin: 0 0 10px 0; }
        .bubble p:last-child { margin: 0; }
        .bubble pre { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 10px 0; }
        .bubble code { background: rgba(0,0,0,0.1); padding: 2px 4px; border-radius: 4px; font-family: monospace; }
        
        /* 用户的气泡：炫彩渐变亮色 */
        .user-bubble { 
            background: var(--user-bubble-bg); 
            border-bottom-right-radius: 4px; 
            color: var(--user-bubble-text, #ffffff);
            border: 1px solid var(--pane-border);
        }
        .user-avatar { 
            width: 32px; height: 32px;
            border-radius: 50%;
            /* 假装有个默认的酷炫用户图 */
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23fff"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>') center/18px no-repeat, var(--primary-accent);
            flex-shrink: 0;
            margin-bottom: 2px;
        }
        
        /* AI的气泡：深邃的高级灰面板 */
        .ai-bubble { 
            background: var(--ai-bubble-bg);
            border-bottom-left-radius: 4px; 
            color: var(--text-color);
            border: 1px solid var(--ai-bubble-border);
        }
        .ai-avatar { 
            width: 32px; height: 32px; 
            border-radius: 50%; 
            background: var(--bot-status-color);
            display: flex; align-items: center; justify-content: center; 
            font-size: 11px; font-weight: 700; color: #fff;
            flex-shrink: 0;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        /* 聊天头部栏 */
        .chat-header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--input-bg);
            padding: 15px 24px;
            border-radius: 20px;
            border: 1px solid var(--pane-border);
        }
        .chat-title { font-weight: 600; font-size: 16px; color: var(--text-color); }
        
        .chat-actions { display: flex; gap: 10px; }
        .action-btn {
            background: var(--btn-bg); border: 1px solid var(--btn-border);
            color: var(--text-color); padding: 6px 12px; border-radius: 8px; font-size: 13px;
            cursor: pointer; transition: 0.2s;
        }
        .action-btn:hover { background: var(--primary-accent); color: #fff; }
        .new-chat-btn { background: var(--primary-accent); border-color: var(--primary-accent); color: #fff;}
        .new-chat-btn:hover { background: var(--primary-hover); }

        /* 历史面板模态框 */
        .history-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px); display: flex; align-items: center; opacity: 0; pointer-events: none;
            transition: 0.3s; z-index: 100;
            justify-content: flex-end; /* 右侧滑出 */
        }
        .history-overlay.active { opacity: 1; pointer-events: auto; }
        .history-panel {
            background: var(--pane-bg); width: 350px; height: 100%; box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            transform: translateX(100%); transition: 0.3s; padding: 30px 20px;
            display: flex; flex-direction: column; box-sizing: border-box;
            border-left: 1px solid var(--pane-border);
        }
        .history-overlay.active .history-panel { transform: translateX(0); }
        .history-header { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid var(--pane-border); padding-bottom: 15px; color: var(--text-color);}
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .history-item {
            padding: 12px; background: var(--chat-area-bg); border: 1px solid var(--pane-border);
            border-radius: 10px; cursor: pointer; transition: 0.2s;
        }
        .history-item:hover, .history-item.active { background: var(--btn-bg); border-color: var(--primary-accent); }
        .history-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; color: var(--text-color);}
        .history-date { font-size: 12px; color: var(--secondary-text); }
        .del-hist-btn { float: right; background: none; border: none; color: #ef4444; cursor: pointer; display: none; }
        .history-item:hover .del-hist-btn { display: inline; }
        
        /* 富交互的底部输入引擎 */
        .input-area { 
            background: var(--input-bg); 
            border-radius: 20px; 
            padding: 16px 24px; 
            display: flex; 
            flex-direction: column; 
            border: 1px solid var(--pane-border);
            min-height: 110px;
            transition: border-color 0.3s ease;
        }
        
        .input-area:focus-within {
            border-color: var(--primary-accent);
        }

        textarea { 
            flex: 1; 
            border: none; 
            background: transparent; 
            resize: none; 
            font-size: 15px;
            color: var(--text-color);
            outline: none;
            line-height: 1.5;
        }
        
        textarea::placeholder {
            color: var(--secondary-text);
        }
        
        .bottom-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .bot-status {
            font-size: 12px;
            color: var(--secondary-text);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bot-status::before {
            content: "";
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--bot-status-color);
        }

        .send-btn { 
            background: var(--btn-border); 
            color: var(--text-color); 
            border: none; 
            padding: 8px 24px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .send-btn:hover {
            background: var(--primary-accent);
            color: #fff;
        }
        .send-btn:active {
            transform: translateY(1px);
        }
        
        /* 简单的打字动画 */
        .typing {
            display: inline-block;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: #cbd5e1;
            animation: bounce 1.4s infinite ease-in-out both;
            margin: 0 2px;
        }
        .typing:nth-child(1) { animation-delay: -0.32s; }
        .typing:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.5); }
        }
    </style>
    <!-- Add i18n support -->
    <script src="/static/js/i18n.js?v=20260822fix1"></script>
    <!-- Add marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Configure marked to handle line breaks like GitHub
        marked.setOptions({
            breaks: true,
            gfm: true
        });
    </script>
</head>
<body>
    <script>
        // When embedded inside the library's tabbed reader workspace (?embed=1),
        // the parent page already renders a tab bar with a "back to library" pin,
        // so the in-page "返回主页" button here would be redundant.
        (function () {
            try {
                if (new URLSearchParams(location.search).get('embed') === '1') {
                    document.documentElement.classList.add('paperfect-embedded');
                }
            } catch (e) {}
        })();
    </script>
    <style>.paperfect-embedded .chat-back-home-btn { display: none !important; }</style>
    <!-- 全局主控栏（顶部导航排版条） -->
    {% if is_paper %}
    <div class="layout-controls">
        <!-- 返回主界面按钮 -->
        <button class="layout-btn chat-back-home-btn" onclick="window.location.href='/'">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span data-i18n="chat.back">返回主页</span>
        </button>

        <div class="toolbar-divider"></div>

        <label class="layout-btn toggle-chip active" id="btn-sync-scroll">
            <input type="checkbox" id="sync-scroll-checkbox" checked>
            <span id="sync-scroll-text" data-i18n="chat.sync_scroll_on">滚动同步: 开</span>
        </label>

        <div class="toolbar-divider"></div>

        <div class="view-switch">
            <button class="view-btn active" id="btn-layout-orig" onclick="togglePane('original')">
                <span data-i18n="chat.original">原文</span>
            </button>
            <button class="view-btn" id="btn-layout-anno" onclick="togglePane('annotated')">
                <span data-i18n="chat.annotated">AI标注</span>
            </button>
            <button class="view-btn" id="btn-layout-trans" onclick="togglePane('translated')">
                <span data-i18n="chat.translated">翻译</span>
            </button>
            <button class="view-btn" id="btn-layout-ppt" onclick="togglePane('ppt')">
                <span data-i18n="chat.ppt">PPT</span>
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <button class="layout-btn toggle-chip" id="btn-layout-realtime" onclick="togglePane('realtime')">
            <span data-i18n="chat.realtime">实时翻译</span>
        </button>
        <button class="layout-btn toggle-chip active" id="btn-layout-chat" onclick="togglePane('chat')">
            <span data-i18n="chat.ai">AI</span>
        </button>

        <div class="toolbar-divider"></div>

        <div class="tools-wrap" id="tools-menu-wrap">
            <button class="layout-btn icon-btn-pill" id="btn-tools">
                <span data-i18n="chat.tools">工具</span>
            </button>
            <div id="tools-dropdown" class="tool-panel">
                <div class="tool-panel-dpi">
                    <label data-i18n="chat.tool_dpi_label">导出 DPI</label>
                    <input id="export-dpi" type="number" value="300" min="72" max="600">
                </div>
                <div class="tool-grid" id="chat-tool-grid"></div>
            </div>
        </div>
    </div>
    {% else %}
    <div class="layout-controls" style="justify-content: flex-start;">
        <!-- 返回主界面按钮 -->
        <button class="layout-btn chat-back-home-btn" onclick="window.location.href='/'">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span data-i18n="chat.back">返回主页</span>
        </button>
    </div>
    {% endif %}

    <div class="panes-container">
        <!-- 原文PDF -->
        <div class="pane" id="pane-original">
            <div class="pane-header" data-i18n="chat.pane_original">PDF 原文版</div>
            <iframe id="iframe-original" data-src="/static/pdfjs/web/viewer.html?file=/pdf/{{ book_name }}#pagemode=none" title="Original PDF Viewer"></iframe>
        </div>
        
        <!-- 翻译PDF (仅论文模式下存在且默认可能显示) -->
        {% if is_paper %}
        <div class="pane" id="pane-annotated" style="display: none;">
            <div class="pane-header" data-i18n="chat.pane_annotated">AI 批注版 PDF</div>
            <iframe id="iframe-annotated" data-src="/static/pdfjs/web/viewer.html?file=/pdf_annotated/{{ book_name }}#pagemode=none" title="Annotated PDF Viewer" onerror="this.src='/static/pdfjs/web/viewer.html?file=/pdf/{{ book_name }}#pagemode=none'; alert(t('chat.no_annotation'));"></iframe>
        </div>
        <div class="pane" id="pane-translated" style="display: none;">
            <div class="pane-header" data-i18n="chat.pane_translated">PDF 翻译版</div>
            <iframe id="iframe-translated" data-src="/static/pdfjs/web/viewer.html?file=/pdf_translated/{{ book_name }}#pagemode=none" title="Translated PDF Viewer"></iframe>
        </div>
        <div class="pane" id="pane-ppt" style="display: none;">
            <div class="pane-header" data-i18n="chat.pane_ppt">PPT 独立流式编辑器</div>
            {# Static SPA under FastAPI — no separate Node/Vite process needed #}
            {# v= busts Electron persist:paperfect cache so toolbar redesign loads #}

                    <textarea id="realtime-source-text" autocomplete="off" spellcheck="false" data-form-type="other" data-i18n="chat.source_placeholder" placeholder="在主页面的文献中划选文字，将自动显示在此处..." style="flex: 1; border: none; background: transparent; color: var(--text-color); padding: 12px; resize: none; font-size: 14px; outline: none;"></textarea>
                </div>
                <div style="flex: 1; display: flex; flex-direction: column; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--pane-border); overflow: hidden;">
                    <div style="padding: 8px 12px; font-size: 12px; color: var(--text-muted); background: var(--header-bg); border-bottom: 1px solid var(--pane-border); display: flex; justify-content: space-between;">
                        <span data-i18n="chat.result_label">翻译结果</span>
                        <span id="realtime-status" style="color: var(--primary-accent);" data-i18n="chat.status_waiting">等待中...</span>
                    </div>
                    <div id="realtime-result-text" style="flex: 1; padding: 12px; font-size: 14px; color: var(--text-color); overflow-y: auto; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap;"></div>
                </div>

        <div class="pane right-pane" id="pane-chat">

            <div style="flex:1; display:flex; flex-direction:column; padding: 0 20px 20px; gap: 20px; overflow: hidden;">
                <div class="chat-header">
            <div class="chat-title"></div>
            <div class="chat-actions">
                <button class="action-btn" onclick="openHistory()" data-i18n="chat.history">历史对话</button>
                <button class="action-btn new-chat-btn" onclick="startNewSession()" data-i18n="chat.new_session">开启新对话</button>
            </div>
        </div>

        <div class="chat-area" id="chat">
            <!-- Chat bubules injected dynamically -->
        </div>
        
            <div class="input-area">
                <textarea id="msg" data-i18n="chat.placeholder" placeholder="请输入您关于这档文档的任何疑问，或者指定页码进行问答..."></textarea>
                <div class="bottom-actions">
                    <div class="bot-status" style="display: none;"></div>
                    <button class="send-btn" onclick="sendMsg()" data-i18n="chat.send">发送 (Enter)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 历史面板 -->
    <div class="history-overlay" id="histModal">
        <div class="history-panel">
            <div class="history-header">
                <h3 style="margin:0">对话历史</h3>
                <button onclick="document.getElementById('histModal').classList.remove('active')" style="background:none;border:none;color:var(--text-color);cursor:pointer;font-size:20px">&times;</button>
            </div>
            <div class="history-list" id="histList"></div>
        </div>
    </div>

    <script src="/static/js/pdf_sync.js"></script>
    <script src="/static/js/realtime_trans.js?v=4"></script>
    <script src="/static/js/tool_icons.js"></script>
    <script>
        // PPT Page Mapping & Slide Change Sync Listener
        // page_mapping keys are slide indices (strings); values are 1-based PDF page numbers.
        // Follow-up slides (补充说明) share the parent figure's PDF page.
        window.pptPageMapping = null;
        window.pptCurrentSlideIndex = 0;
        window.addEventListener('message', (event) => {
            if (event.data) {
                if (event.data.type === 'PPT_MAPPING_LOADED') {
                    window.pptPageMapping = event.data.page_mapping;
                    console.log("[Parent] Loaded PPT page mapping:", window.pptPageMapping);
                } else if (event.data.type === 'SLIDE_CHANGED_BY_USER') {
                    const slideIndex = event.data.slideIndex;
                    window.pptCurrentSlideIndex = slideIndex;
                    console.log("[Parent] Slide changed by user:", slideIndex);
                    const map = window.pptPageMapping;
                    if (map && (map[slideIndex] !== undefined || map[String(slideIndex)] !== undefined)) {
                        const targetPage = map[slideIndex] !== undefined ? map[slideIndex] : map[String(slideIndex)];
                        console.log("[Parent] Navigating PDF to page:", targetPage);
                        
                        if (window.pdfSyncManager && window.pdfSyncManager.iframes) {
                            // Temporarily disable scroll sync during page navigation to prevent race condition
                            const originalSyncState = window.pdfSyncManager.isSyncEnabled;
                            window.pdfSyncManager.isSyncEnabled = false;

                            for (const [id, iframe] of Object.entries(window.pdfSyncManager.iframes)) {
                                if (iframe.offsetParent !== null) { // Visible pane
                                    try {
                                        const innerWin = iframe.contentWindow;
                                        if (innerWin && innerWin.PDFViewerApplication) {
                                            // Only jump if page actually changes (avoid jitter on 补充说明 of same page)
                                            if (innerWin.PDFViewerApplication.page !== targetPage) {
                                                innerWin.PDFViewerApplication.page = targetPage;
                                            }
                                        }
                                    } catch (e) {
                                        console.warn("[Parent] Failed to set page for iframe:", id, e.message);
                                    }
                                }
                            }

                            // Re-enable sync after pages settle
                            setTimeout(() => {
                                window.pdfSyncManager.isSyncEnabled = originalSyncState;
                            }, 500);
                        }
                    }
                }
            }
        });

        // Check theme setup from homepage preference
        function normalizeTheme(t) {
            t = t || 'antigravity';
            if (t === 'light') t = 'cyan-light';
            if (t === 'dark' || t === 'github-dark') t = 'antigravity';
            if (t === 'github-light') t = 'cyan-light';
            return t;
        }
        let activeTheme = normalizeTheme(localStorage.getItem('theme'));
        document.body.setAttribute('data-theme', activeTheme);
        localStorage.setItem('theme', activeTheme);

        // This page is normally embedded as an iframe inside the library's tabbed
        // reader; switching theme there only updates the parent document, so a
        // tab opened before the switch was stuck on its original theme forever.
        // Same-origin localStorage writes fire a native 'storage' event in every
        // OTHER window/frame -- listen for it here to stay in sync live.
        window.addEventListener('storage', (e) => {
            if (e.key !== 'theme' || e.newValue == null) return;
            activeTheme = normalizeTheme(e.newValue);
            document.documentElement.setAttribute('data-theme', activeTheme);
            document.body.setAttribute('data-theme', activeTheme);
        });
        
        const storeKey = "chat_histories_{{ book_name }}";
        let chatHistory = []; // current context
        let currentSessionId = null;
        const msgInput = document.getElementById("msg");

        // Layout Toggle Logic & Resizer Logic
        function ensurePaneLoaded(paneType) {
            const iframeMap = {
                original: 'iframe-original',
                annotated: 'iframe-annotated',
                translated: 'iframe-translated',
                ppt: 'iframe-ppt',
            };
            const id = iframeMap[paneType];
            if (!id) return;
            const iframe = document.getElementById(id);
            if (!iframe || iframe.getAttribute('src')) return;
            const baseSrc = iframe.getAttribute('data-src');
            if (!baseSrc) return;
            iframe.src = withCacheBust(baseSrc);
            if (window.pdfSyncManager && paneType !== 'ppt') {
                window.pdfSyncManager.registerIframe(paneType, iframe);
            }
        }

        function togglePane(paneType) {
            const mappings = {
                'original': {pane: 'pane-original', btn: 'btn-layout-orig'},
                'annotated': {pane: 'pane-annotated', btn: 'btn-layout-anno'},
                'translated': {pane: 'pane-translated', btn: 'btn-layout-trans'},
                'ppt': {pane: 'pane-ppt', btn: 'btn-layout-ppt'},
                'chat': {pane: 'pane-chat', btn: 'btn-layout-chat'},
                'realtime': {pane: 'pane-realtime-trans', btn: 'btn-layout-realtime'}
            };
            const map = mappings[paneType];
            if (map) {
                const pane = document.getElementById(map.pane);
                const btn = document.getElementById(map.btn);
                if (pane && btn) {
                    btn.classList.toggle('active');
                    const show = btn.classList.contains('active');
                    pane.style.display = show ? 'flex' : 'none';
                    if (show) ensurePaneLoaded(paneType);
                    updateResizers();
                }
            }
        }

        function withCacheBust(url) {
            if (!url) return url;
            const hashAt = url.indexOf('#');
            const pre = hashAt >= 0 ? url.slice(0, hashAt) : url;
            const hash = hashAt >= 0 ? url.slice(hashAt) : '';
            const join = pre.includes('?') ? '&' : '?';
            return pre + join + 't=' + Date.now() + hash;
        }

        async function runPaperTool(kind) {
            const book = "{{ book_name }}";
            const dpi = parseInt((document.getElementById('export-dpi') || {}).value || '300', 10) || 300;
            const endpoints = {
                images: `/api/tools/export/images?book_name=${encodeURIComponent(book)}&dpi=${dpi}`,
                figures: `/api/tools/export/figures?book_name=${encodeURIComponent(book)}&dpi=${dpi}`,
                docx: `/api/tools/export/docx?book_name=${encodeURIComponent(book)}`,
                md: `/api/tools/export/text?book_name=${encodeURIComponent(book)}&fmt=md`,
                tex: `/api/tools/export/text?book_name=${encodeURIComponent(book)}&fmt=tex`,
                ocr: `/api/tools/ocr?book_name=${encodeURIComponent(book)}`,
            };
            // Tools that need one extra parameter via a lightweight prompt()
            if (kind === 'rotate') {
                const angle = prompt('旋转角度（顺时针，90/180/270）', '90');
                if (angle === null) return;
                endpoints.rotate = `/api/tools/rotate?book_name=${encodeURIComponent(book)}&angle=${encodeURIComponent(angle || '90')}`;
            } else if (kind === 'split') {
                const range = prompt('输入页面范围，例如 1-5', '1-5');
                if (range === null) return;
                const m = String(range).match(/(\d+)\s*-\s*(\d+)/);
                const start = m ? m[1] : (range || '1');
                const end = m ? m[2] : '';
                endpoints.split = `/api/tools/split?book_name=${encodeURIComponent(book)}&start=${encodeURIComponent(start)}` + (end ? `&end=${encodeURIComponent(end)}` : '');
            } else if (kind === 'watermark') {
                const text = prompt('水印文字', 'Paperfect');
                if (text === null || !text.trim()) return;
                endpoints.watermark = `/api/tools/watermark?book_name=${encodeURIComponent(book)}&text=${encodeURIComponent(text)}`;
            } else if (kind === 'protect') {
                const pwd = prompt('设置打开密码', '');
                if (pwd === null || !pwd.trim()) return;
                endpoints.protect = `/api/tools/protect?book_name=${encodeURIComponent(book)}&password=${encodeURIComponent(pwd)}`;
            } else if (kind === 'unlock') {
                const pwd = prompt('输入当前密码（若无密码可留空）', '');
                if (pwd === null) return;
                endpoints.unlock = `/api/tools/unlock?book_name=${encodeURIComponent(book)}&password=${encodeURIComponent(pwd)}`;
            } else if (kind === 'compress') {
                endpoints.compress = `/api/tools/compress?book_name=${encodeURIComponent(book)}`;
            }
            const url = endpoints[kind];
            if (!url) return;
            const label = document.querySelector('#btn-tools [data-i18n="chat.tools"]');
            const old = label ? label.textContent : '';
            if (label) label.textContent = '...';
            try {
                const res = await fetch(url, { method: 'POST' });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    alert(data.detail || data.message || ('HTTP ' + res.status));
                    return;
                }
                if (data.download) window.location.href = data.download;
                else alert(data.status || 'ok');
            } catch (e) {
                alert(e.message || String(e));
            } finally {
                if (label) label.textContent = old || t('chat.tools');
                const dd = document.getElementById('tools-dropdown');
                if (dd) dd.style.display = 'none';
            }
        }

        window.addEventListener('message', async (ev) => {
            const d = ev.data || {};
            if (d.type === 'paperfect-open-realtime') {
                const btn = document.getElementById('btn-layout-realtime');
                if (btn && !btn.classList.contains('active')) btn.click();
                const mgr = window.RealtimeTranslationManagerInstance;
                if (mgr && d.text) mgr.applySelectedText(d.text, { force: true });
                return;
            }
            if (d.type === 'paperfect-selection') {
                const mgr = window.RealtimeTranslationManagerInstance;
                if (mgr && d.text) mgr.applySelectedText(d.text);
                return;
            }
            if (d.type !== 'paperfect-markup') return;
            try {
                const source = d.source || 'raw';
                await fetch('/api/tools/markup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        book_name: "{{ book_name }}",
                        page: d.page,
                        kind: d.kind || 'highlight',
                        note: d.note || '',
                        rects: d.rects || [],
                        source,
                    }),
                });
                const iframeId = source === 'translated' ? 'iframe-translated'
                    : source === 'annotated' ? 'iframe-annotated' : 'iframe-original';
                const iframe = document.getElementById(iframeId);
                if (iframe) {
                    const base = iframe.getAttribute('data-src') || iframe.src;
                    iframe.src = withCacheBust(base);
                }
            } catch (e) {
                console.warn('markup failed', e);
            }
        });

        function updateResizers() {
            document.querySelectorAll('.resizer').forEach(el => el.remove());
            
            const container = document.querySelector('.panes-container');
            const visiblePanes = Array.from(container.querySelectorAll('.pane')).filter(p => p.style.display !== 'none');
            
            visiblePanes.forEach(p => {
                p.style.flex = "1 1 0%";
            });

            for(let i=0; i<visiblePanes.length - 1; i++) {
                const resizer = document.createElement('div');
                resizer.className = 'resizer';
                container.insertBefore(resizer, visiblePanes[i].nextSibling);
                
                resizer.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    let prevPane = visiblePanes[i];
                    let nextPane = visiblePanes[i+1];
                    let startX = e.clientX;
                    let prevFlex = prevPane.getBoundingClientRect().width;
                    let nextFlex = nextPane.getBoundingClientRect().width;
                    
                    const overlay = document.createElement('div');
                    overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;cursor:col-resize;';
                    document.body.appendChild(overlay);

                    function onMouseMove(e) {
                        let dx = e.clientX - startX;
                        let newPrev = prevFlex + dx;
                        let newNext = nextFlex - dx;
                        
                        // Prevent too small panes
                        if(newPrev < 200 || newNext < 200) return;
                        
                        prevPane.style.flex = `${newPrev} 1 0%`;
                        nextPane.style.flex = `${newNext} 1 0%`;
                    }
                    
                    function onMouseUp() {
                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                        overlay.remove();
                    }
                    
                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });
            }
        }

        // Load Memory
        function getSessions() {
            return JSON.parse(localStorage.getItem(storeKey) || "[]");
        }
        function saveSessions(sessions) {
            localStorage.setItem(storeKey, JSON.stringify(sessions));
        }
        
        function initChat() {
            const sessions = getSessions();
            if (sessions.length > 0) {
                loadSession(sessions[0].id);
            } else {
                startNewSession();
            }
        }

        function startNewSession() {
            currentSessionId = Date.now().toString();
            chatHistory = [];
            const sessions = getSessions();
            sessions.unshift({
                id: currentSessionId,
                title: "新对话 " + new Date().toLocaleString(),
                messages: []
            });
            saveSessions(sessions);
            renderChatArea();
        }
        
        function loadSession(id) {
            currentSessionId = id;
            const sessions = getSessions();
            const session = sessions.find(s => s.id === id);
            if(session) {
                chatHistory = session.messages;
            } else {
                chatHistory = [];
            }
            renderChatArea();
            document.getElementById('histModal').classList.remove('active');
        }

        function deleteSession(e, id) {
            e.stopPropagation();
            let sessions = getSessions().filter(s => s.id !== id);
            saveSessions(sessions);
            if(sessions.length > 0) {
                loadSession(sessions[0].id);
            } else {
                startNewSession();
            }
            renderHistoryList();
        }

        function saveCurrentMessage(role, content) {
            chatHistory.push({role, content});
            const sessions = getSessions();
            const session = sessions.find(s => s.id === currentSessionId);
            if(session) {
                session.messages = chatHistory;
                // auto update title based on first query
                if (role === "user" && chatHistory.filter(m => m.role === "user").length === 1) {
                    session.title = content.substring(0, 15) + (content.length > 15 ? "..." : "");
                }
                saveSessions(sessions);
            }
        }

        function renderChatArea() {
            const chatBox = document.getElementById("chat");
            chatBox.innerHTML = ``;
            chatHistory.forEach(msg => {
                appendBubble(msg.content, msg.role, false);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function openHistory() {
            renderHistoryList();
            document.getElementById('histModal').classList.add('active');
        }

        function renderHistoryList() {
            const list = document.getElementById('histList');
            const sessions = getSessions();
            list.innerHTML = "";
            sessions.forEach(s => {
                const div = document.createElement("div");
                div.className = "history-item " + (s.id === currentSessionId ? "active" : "");
                div.onclick = () => loadSession(s.id);
                div.innerHTML = `
                    <button class="del-hist-btn" onclick="deleteSession(event, '${s.id}')">删除</button>
                    <div class="history-title">${s.title}</div>
                    <div class="history-date">${new Date(parseInt(s.id)).toLocaleString()}</div>
                `;
                list.appendChild(div);
            });
        }
        
        msgInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMsg();
            }
        });
        
        async function sendMsg() {
            const text = msgInput.value.trim();
            if(!text) return;
            
            msgInput.value = "";
            appendBubble(text, "user", true);
            
            const chatBox = document.getElementById("chat");
            const aiRow = document.createElement("div");
            aiRow.className = "bubble-container ai-row";
            aiRow.innerHTML = `
                <div class="ai-avatar">AI</div>
                <div class="bubble ai-bubble">
                    <span class="typing"></span>
                    <span class="typing"></span>
                    <span class="typing"></span>
                </div>
            `;
            chatBox.appendChild(aiRow);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        book_name: "{{ book_name }}",
                        message: text,
                        chat_history: chatHistory
                    })
                });
                const data = await res.json();
                
                aiRow.querySelector('.ai-bubble').innerHTML = marked.parse(data.reply);
                chatBox.scrollTop = chatBox.scrollHeight;
                
                saveCurrentMessage("assistant", data.reply);
                
            } catch(e) {
                aiRow.querySelector('.ai-bubble').innerText = "神经链路连接失败 / 服务端错误：" + e.message;
            }
        }
        
        function appendBubble(text, role, save = false) {
            const chatBox = document.getElementById("chat");
            const row = document.createElement("div");
            row.className = role === "user" ? "bubble-container user-row" : "bubble-container ai-row";
            
            if (role === "user") {
                // For user messages, simple text escaping (prevent XSS) and formatting
                const safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
                row.innerHTML = `<div class="bubble user-bubble">${safeText}</div><div class="user-avatar"></div>`;
            } else {
                row.innerHTML = `<div class="ai-avatar">AI</div><div class="bubble ai-bubble">${marked.parse(text)}</div>`;
            }
            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;

            if (save) {
                saveCurrentMessage(role, text);
            }
        }

        function applyPageTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (key === 'chat.sync_scroll_on' || key === 'chat.sync_scroll_off') {
                    return;
                }
                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                    el.placeholder = t(key);
                } else {
                    el.innerText = t(key);
                }
            });

            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                const key = el.getAttribute('data-i18n-title');
                el.title = t(key);
            });

            const syncCheckbox = document.getElementById('sync-scroll-checkbox');
            const syncText = document.getElementById('sync-scroll-text');
            if (syncCheckbox && syncText) {
                const isEnabled = syncCheckbox.checked;
                syncText.textContent = isEnabled ? t('chat.sync_scroll_on') : t('chat.sync_scroll_off');
            }
        }

        // On Load Init
        const CHAT_TOOL_LIST = [
            { id: 'images', icon: 'images', label: 'chat.tool_pages' },
            { id: 'figures', icon: 'figures', label: 'chat.tool_figures' },
            { id: 'docx', icon: 'docx', label: 'chat.tool_docx' },
            { id: 'md', icon: 'md', label: 'chat.tool_md' },
            { id: 'tex', icon: 'tex', label: 'chat.tool_tex' },
            { id: 'ocr', icon: 'ocr', label: 'chat.tool_ocr' },
            { id: 'rotate', icon: 'rotate', label: 'chat.tool_rotate' },
            { id: 'split', icon: 'split', label: 'chat.tool_split' },
            { id: 'compress', icon: 'compress', label: 'chat.tool_compress' },
            { id: 'watermark', icon: 'watermark', label: 'chat.tool_watermark' },
            { id: 'protect', icon: 'protect', label: 'chat.tool_protect' },
            { id: 'unlock', icon: 'unlock', label: 'chat.tool_unlock' },
        ];

        function initToolbarIcons() {
            const icons = window.PAPERFECT_TOOL_ICONS || {};
            document.querySelectorAll('.btn-ic[data-icon]').forEach(el => {
                el.innerHTML = icons[el.getAttribute('data-icon')] || '';
            });
            const grid = document.getElementById('chat-tool-grid');
            if (grid) {
                grid.innerHTML = CHAT_TOOL_LIST.map(tool => `
                    <div class="tool-card" onclick="runPaperTool('${tool.id}')" title="${t(tool.label)}">
                        ${icons[tool.icon] || ''}
                        <span data-i18n="${tool.label}">${t(tool.label)}</span>
                    </div>
                `).join('');
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            initChat();
            updateResizers();
            applyPageTranslations();
            initToolbarIcons();

            // Initialize PDF Scroll Synchronization
            const syncManager = new PdfScrollSyncManager();
            window.pdfSyncManager = syncManager;
            const iframeOriginal = document.getElementById('iframe-original');
            const iframeAnnotated = document.getElementById('iframe-annotated');
            const iframeTranslated = document.getElementById('iframe-translated');

            if (iframeOriginal) {
                const baseSrc = iframeOriginal.getAttribute('data-src');
                iframeOriginal.src = withCacheBust(baseSrc);
                syncManager.registerIframe('original', iframeOriginal);
            }
            // annotated / translated / ppt load on first pane open (saves RAM/CPU)

            syncManager.initListeners();

            document.addEventListener('click', (e) => {
                const wrap = document.getElementById('tools-menu-wrap');
                const dd = document.getElementById('tools-dropdown');
                if (!wrap || !dd) return;
                if (!wrap.contains(e.target)) dd.style.display = 'none';
                else if (e.target.closest('#btn-tools')) dd.style.display = dd.style.display === 'flex' ? 'none' : 'flex';
            });

            // Handle Sync Toggle
            const syncCheckbox = document.getElementById('sync-scroll-checkbox');
            const syncText = document.getElementById('sync-scroll-text');
            const btnSyncScroll = document.getElementById('btn-sync-scroll');
            if (syncCheckbox) {
                syncCheckbox.addEventListener('change', (e) => {
                    const isEnabled = e.target.checked;
                    syncText.textContent = isEnabled ? t('chat.sync_scroll_on') : t('chat.sync_scroll_off');
                    if (isEnabled) {
                        btnSyncScroll.classList.add('active');
                    } else {
                        btnSyncScroll.classList.remove('active');
                    }
                    syncManager.setSyncState(isEnabled);
                });
            }
        });
    </script>
</body>
</html>
