name: Verify source
on: [push, pull_request]
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/standalone_pdf2ppt/ppt_maker/package-lock.json
      - run: python -m pip install PyMuPDF==1.28.2 openai fastapi httpx python-dotenv python-pptx
      - run: npm ci --prefix backend/standalone_pdf2ppt/ppt_maker
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: node --check backend/standalone_pdf2ppt/ppt_maker/generate_full_ppt.js
      - run: node --check frontend/static/js/research_workspace.js
